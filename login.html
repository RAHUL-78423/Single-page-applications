<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Web Page</title>

    <style>
        body

        header {
            background-color: #2563eb;
            color: white;
            padding: 30px;
        }

        .container {
            margin: 50px auto;
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My first HTML project 🚀</p>
    </header>

    <div class="container">
        <h2>Hello!</h2>

        <p>
            This is a simple webpage created using HTML and CSS.
        </p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
